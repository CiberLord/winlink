name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: .\test\windows.ps1 -SmokeOpenSSH
        shell: powershell
